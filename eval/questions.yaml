- id: q17
  category: 선수
  question: 2026시즌 수비수(DF) 중 득점 1위
  order_matters: false
  # 수정(2026-11-04): game_player_stat.position 은 그 경기 위치라 교체 출전이면 '대기' → 교체로 넣은 골이 빠졌음.
  #   포지션은 등록 포지션(player.position) 기준으로 바꿈 (1위 선수가 달라짐)
  sql: |
    SELECT s.player_name, SUM(s.goals) FROM game_player_stat s JOIN player p ON p.player_id = s.player_id
    WHERE s.meet_year = 2026 AND s.meet_seq = 1 AND p.position = 'DF'
    GROUP BY s.player_id, s.player_name HAVING SUM(s.goals) = (SELECT MAX(t) FROM (SELECT SUM(s2.goals) AS t
      FROM game_player_stat s2 JOIN player p2 ON p2.player_id = s2.player_id
      WHERE s2.meet_year = 2026 AND s2.meet_seq = 1 AND p2.position = 'DF' GROUP BY s2.player_id) x)

- id: q18
  category: 복합
  question: 2026시즌 비 오는 날 경기의 평균 득점(양 팀 합)
  order_matters: false
  # 수정(2026-11-04): meet_seq = 1 누락 + 실제 날씨 값에 '흐리고 비'도 있어 weather = '비' 로는 일부 누락
  #   → LIKE '%비%'
  sql: |
    SELECT ROUND(AVG(home_goal + away_goal), 2) FROM game
    WHERE meet_year = 2026 AND meet_seq = 1 AND weather LIKE '%비%' AND is_finished = 1

- id: q19
  category: 팀
  question: 2026시즌 홈 승률이 가장 높은 팀
  order_matters: false
  sql: |
    SELECT team_id, ROUND(1.0 * SUM(CASE WHEN result='W' THEN 1 ELSE 0 END) / COUNT(*), 3) AS r
    FROM game_team_stat WHERE meet_year = 2026 AND meet_seq = 1 AND is_home = 1 GROUP BY team_id
    HAVING ROUND(1.0 * SUM(CASE WHEN result='W' THEN 1 ELSE 0 END) / COUNT(*), 3) = (
      SELECT MAX(r2) FROM (SELECT ROUND(1.0 * SUM(CASE WHEN result='W' THEN 1 ELSE 0 END) / COUNT(*), 3) AS r2
      FROM game_team_stat WHERE meet_year = 2026 AND meet_seq = 1 AND is_home = 1 GROUP BY team_id) x)

