# 평가셋: 질문 + 정답 SQL. 정답 SQL 실행 결과와 AI SQL 실행 결과를 비교해 채점한다.
# order_matters: true → 순서까지 같아야 정답 (순위형 질문)
# 카테고리: 선수 / 팀 / 관중 / 경기 / 이벤트 / 복합
- id: q01
  category: 선수
  question: 2026 K리그1 득점왕은 누구야?
  order_matters: false
  # 수정(2026-11-05, 평가 결과를 본 뒤, 고정 예외): K리그 대회요강 제30조 4항(개인기록 순위결정)에 따라
  #   득점 동률이면 ① 최다 득점 → ② 출전경기 적은 선수 → ③ 출전시간 적은 선수 순으로 1명.
  #   2026 K리그1 의 game_player_stat 은 1~38R(스플릿일반·파이널A/B) 경기만 있어 전체 라운드 조건과 같다.
  #   선수 이름만 비교한다: 숫자(득점) 컬럼을 넣으면 채점기가 숫자만 비교해, 같은 골 수의 다른 선수도 정답이 되기 때문.
  sql: |
    SELECT player_name FROM game_player_stat
    WHERE meet_year = 2026 AND meet_seq = 1 GROUP BY player_id, player_name
    ORDER BY SUM(goals) DESC, SUM(played) ASC, SUM(minutes) ASC LIMIT 1

- id: q02
  category: 팀
  question: 올해 K리그1 1위 팀과 승점은?
  order_matters: false
  sql: |
