- id: q40
  category: 선수
  question: 2026 K리그1에서 뛰었는데 지금은 K리그를 떠난 선수는 몇 명?
  order_matters: false
  sql: |
    SELECT COUNT(DISTINCT s.player_id) FROM game_player_stat s JOIN player p ON p.player_id = s.player_id
    WHERE s.meet_year = 2026 AND s.meet_seq = 1 AND s.played = 1 AND p.is_active = 0
