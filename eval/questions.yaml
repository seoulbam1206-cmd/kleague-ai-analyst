- id: q28
  category: 팀
  question: 2025 K리그1 파이널B에서 가장 많이 이긴 팀
  order_matters: false
  sql: |
    SELECT t.team_id, COUNT(*) FROM game_team_stat t
    JOIN game g ON g.meet_year = t.meet_year AND g.meet_seq = t.meet_seq AND g.game_id = t.game_id
    WHERE t.meet_year = 2025 AND t.meet_seq = 1 AND g.game_type_name = '파이널B' AND t.result = 'W'
    GROUP BY t.team_id HAVING COUNT(*) = (SELECT MAX(n) FROM (SELECT COUNT(*) AS n FROM game_team_stat t2
      JOIN game g2 ON g2.meet_year = t2.meet_year AND g2.meet_seq = t2.meet_seq AND g2.game_id = t2.game_id
      WHERE t2.meet_year = 2025 AND t2.meet_seq = 1 AND g2.game_type_name = '파이널B' AND t2.result = 'W'
      GROUP BY t2.team_id) x)

