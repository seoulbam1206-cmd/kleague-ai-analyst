- id: q03
  category: 관중
  question: 2026시즌 관중이 가장 많았던 경기 3개
  order_matters: true
  # 수정(2026-11-04): 리그 미지정 = K리그1 규칙에 맞춰 meet_seq = 1 추가 (결과는 같음)
  # 수정(2026-11-05, 평가 결과를 본 뒤): 질문이 묻지 않은 내부 번호 game_id 를 빼고,
  #   사용자에게 의미 있는 값(경기 날짜·홈팀·원정팀·홈 득점·원정 득점·관중)으로 바꿈
  sql: |
    SELECT g.game_date, ch.team_s_name AS home_team, ca.team_s_name AS away_team,
           g.home_goal, g.away_goal, g.audience
    FROM game g JOIN club ch ON ch.team_id = g.home_team_id JOIN club ca ON ca.team_id = g.away_team_id
    WHERE g.meet_year = 2026 AND g.meet_seq = 1 AND g.is_finished = 1
    ORDER BY g.audience DESC LIMIT 3

- id: q04
  category: 팀
  question: 전북은 2026시즌 몇 승 몇 무 몇 패야?
  order_matters: false
  sql: |
    SELECT SUM(CASE WHEN result='W' THEN 1 ELSE 0 END), SUM(CASE WHEN result='D' THEN 1 ELSE 0 END),
           SUM(CASE WHEN result='L' THEN 1 ELSE 0 END)
    FROM game_team_stat WHERE meet_year = 2026 AND meet_seq = 1 AND team_id = 'K05'

- id: q05
  category: 관중
  question: 2026년 토요일 경기 평균 관중은?
  order_matters: false
  # 수정(2026-11-04): meet_seq = 1 누락 → K리그2 경기까지 섞여 평균이 달라졌음
  sql: |
    SELECT ROUND(AVG(audience)) FROM game WHERE meet_year = 2026 AND meet_seq = 1 AND weekday = '토' AND is_finished = 1

- id: q06
  category: 팀
  question: 2026 K리그1 최다 득점 팀
  order_matters: false
  sql: |
    SELECT team_id, SUM(goals_for) AS gf FROM game_team_stat WHERE meet_year = 2026 AND meet_seq = 1
    GROUP BY team_id HAVING SUM(goals_for) = (SELECT MAX(s) FROM (SELECT SUM(goals_for) AS s
      FROM game_team_stat WHERE meet_year = 2026 AND meet_seq = 1 GROUP BY team_id) x)

- id: q07
  category: 선수
  question: 2026시즌 공격포인트(골+도움) 상위 5명
  order_matters: true
  sql: |
    SELECT player_name, SUM(goals) + SUM(assists) AS ap FROM game_player_stat
    WHERE meet_year = 2026 AND meet_seq = 1 GROUP BY player_id, player_name
    ORDER BY ap DESC LIMIT 5

- id: q08
  category: 팀
  question: 2026시즌 실점이 가장 적은 팀은?
  order_matters: false
  sql: |
    SELECT team_id, SUM(goals_against) FROM game_team_stat WHERE meet_year = 2026 AND meet_seq = 1
    GROUP BY team_id HAVING SUM(goals_against) = (SELECT MIN(s) FROM (SELECT SUM(goals_against) AS s
      FROM game_team_stat WHERE meet_year = 2026 AND meet_seq = 1 GROUP BY team_id) x)

- id: q09
  category: 경기
  question: 2026시즌 한 경기 최다 골이 나온 경기의 스코어
  order_matters: false
  # 수정(2026-11-04): meet_seq = 1 누락 → K리그2 경기가 답으로 나왔음
  # 수정(2026-11-05, 평가 결과를 본 뒤): 질문이 묻지 않은 내부 번호 game_id 를 빼고,
  #   사용자에게 의미 있는 값(경기 날짜·홈팀·원정팀·홈 득점·원정 득점)으로 바꿈
  sql: |
    SELECT g.game_date, ch.team_s_name AS home_team, ca.team_s_name AS away_team, g.home_goal, g.away_goal
    FROM game g JOIN club ch ON ch.team_id = g.home_team_id JOIN club ca ON ca.team_id = g.away_team_id
    WHERE g.meet_year = 2026 AND g.meet_seq = 1 AND g.is_finished = 1
      AND g.home_goal + g.away_goal = (SELECT MAX(home_goal + away_goal) FROM game
                                       WHERE meet_year = 2026 AND meet_seq = 1 AND is_finished = 1)

